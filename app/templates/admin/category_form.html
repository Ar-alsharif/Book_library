{% extends 'base.html' %}
{% block title %}{{ 'Edit' if category else 'Add' }} Category — Admin{% endblock %}
{% block content %}
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-title">Admin Panel</div>
    <nav class="sidebar-nav">
      <a href="{{ url_for('admin.dashboard') }}" class="sidebar-link">📊 Dashboard</a>
      <a href="{{ url_for('admin.manage_books') }}" class="sidebar-link">📚 Manage Books</a>
      <a href="{{ url_for('admin.manage_categories') }}" class="sidebar-link active">🏷️ Categories</a>
      <a href="{{ url_for('admin.add_book') }}" class="sidebar-link">➕ Add Book</a>
      <a href="{{ url_for('admin.manage_users') }}" class="sidebar-link">👥 Users</a>
      <hr class="sidebar-divider">
      <a href="{{ url_for('books.browse') }}" class="sidebar-link">🌐 View Site</a>
    </nav>
  </aside>
  <div class="admin-main">
    <div class="admin-header">
      <h1>{{ 'Edit Category' if category else 'Add Category' }}</h1>
      <a href="{{ url_for('admin.manage_categories') }}" class="btn-ghost">← Back</a>
    </div>
    <div class="form-card">
      <form method="POST">
        <div class="form-group">
          <label>Name *</label>
          <input type="text" name="name" value="{{ category.name if category else '' }}" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <input type="text" name="description" value="{{ category.description if category else '' }}">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">
            {{ 'Update' if category else 'Add Category' }}
          </button>
          <a href="{{ url_for('admin.manage_categories') }}" class="btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
